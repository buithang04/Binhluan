# Nginx reverse proxy — Automation Profile Manager
#
# Cài:
#   sudo cp deploy/nginx/apm.conf /etc/nginx/sites-available/apm
#   sudo ln -sf /etc/nginx/sites-available/apm /etc/nginx/sites-enabled/apm
#   sudo nginx -t && sudo systemctl reload nginx
#
# Đổi server_name + đường dẫn SSL cho domain thật.
# App local trên server (không publish 3000/4000 ra ngoài nếu có thể):
#   Next UI  → 127.0.0.1:3000
#   Nest API → 127.0.0.1:4000  (worker gọi thẳng; browser qua /apm-api trên Next)

upstream apm_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream apm_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

# HTTP → HTTPS (bỏ block này nếu chưa có SSL)
server {
    listen 80;
    listen [::]:80;
    server_name apm.example.com;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name apm.example.com;

    # --- SSL (certbot hoặc tự cấp) ---
    ssl_certificate     /etc/letsencrypt/live/apm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apm.example.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 32m;

    # Bảo mật cơ bản
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Nest API trực tiếp (tuỳ chọn — UI thường dùng /apm-api qua Next)
    location /api/ {
        proxy_pass http://apm_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Next.js UI (+ rewrite /apm-api → Nest bên trong Next)
    location / {
        proxy_pass http://apm_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}

